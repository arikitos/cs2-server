// CS2 Manager — Superheroes mode base profile
// Random skill every round, powered by the HeroShift plugin (+ RayTrace).
// Isolated mode: must NOT load MatchZy, AutoReady, Retakes, or Instadefuse.
echo "[CS2 Manager] Loading HeroShift profile"

// Built on the official competitive ruleset so weapons/economy behave normally.
game_alias competitive
exec gamemode_competitive.cfg

bot_quota 0
mp_autoteambalance 1
mp_limitteams 1
mp_friendlyfire 0
mp_warmuptime 20
mp_freezetime 15
mp_roundtime 1.55
mp_maxrounds 24
mp_overtime_enable 1
sv_cheats 0

// Suggest the universal active bind to players joining the mode.
sv_hibernate_when_empty 0
