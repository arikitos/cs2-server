// CS2 Manager — Retake mode base profile.
// Every shared convar lives in the shared base profile; this file adds only what
// Retake itself needs on top of it.
// Isolated mode: must NOT load MatchZy, AutoReady, HeroShift or RayTrace.
echo "[CS2 Manager] Loading Retakes profile"

exec server.cfg

// RetakesPlugin builds the round the moment warmup ends, so keep warmup short.
mp_warmuptime 30
