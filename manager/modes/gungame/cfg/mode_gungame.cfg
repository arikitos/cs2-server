// CS2 Manager — GunGame mode base profile
// Weapon-ladder GunGame, powered by the GG2 plugin (+ its GunGameAPI shared lib).
// Isolated mode: must NOT load MatchZy, AutoReady, Retakes, Instadefuse or HeroShift.
echo "[CS2 Manager] Loading GunGame profile"

// GG2 expects game_type 0 / game_mode 0 (Casual) so the plugin owns weapons,
// levels and respawns instead of the competitive buy economy.
game_alias casual
exec gamemode_casual.cfg

bot_quota 0
mp_autoteambalance 1
mp_limitteams 0
mp_friendlyfire 0

// The weapon ladder decides the winner, not the round clock or the round count.
mp_maxrounds 120
mp_timelimit 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_roundtime_hostage 60
mp_freezetime 3
mp_overtime_enable 0

// GG2 respawns players itself (RespawnByPlugin) and strips dropped weapons.
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_death_drop_gun 0
mp_death_drop_grenade 0
mp_solid_teammates 1

// Warmup length is owned by gungame.json (WarmupTimeLength = 60); keep the engine
// value in step so the plugin countdown matches the server.
mp_warmuptime 60

sv_cheats 0
sv_hibernate_when_empty 0
