// CS2 Manager — shared base server profile.
//
// One command set for every mode, bind-mounted into each game service as
// csgo/cfg/server.cfg and exec'd first by each mode_<id>.cfg. The FaceIt profile
// is the default: any convar every mode should agree on belongs here, not in a
// mode file.
//
// What stays OUT of this file:
//   * Per-mode player capacity — owned by CS2_MAXPLAYERS / <MODE>_CAPACITY in
//     .env (Retake runs 9, every other mode 10).
//   * The hot convars the panel rewrites on Apply (bot_quota, mp_friendlyfire,
//     mp_maxrounds, mp_freezetime, sv_password) — owned by panel_runtime.cfg,
//     which execs after this file and therefore wins.
//   * Plugin-specific convars — declared per mode in mode.json settings.extra_cfg.

echo "[CS2 Manager] Loading shared base profile"

exec gamemode_competitive.cfg

bot_quota 0
mp_autoteambalance 0
mp_limitteams 0
mp_friendlyfire 0
mp_maxrounds 24
mp_freezetime 15
sv_pausable 1
sv_cheats 0
sv_hibernate_when_empty 0
mp_restartgame 1
