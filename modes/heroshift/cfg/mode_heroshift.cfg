// CS2 Manager — HeroShift mode base profile.
// Random skill every round, powered by the HeroShift plugin (+ RayTrace).
// Every shared convar lives in the shared base profile; this file adds only what
// HeroShift itself needs on top of it.
// Isolated mode: must NOT load MatchZy, AutoReady, Retakes or Instadefuse.
echo "[CS2 Manager] Loading HeroShift profile"

exec server.cfg

// Skills are round-scoped, so rounds run slightly shorter than the stock
// competitive length and warmup is kept brief. Round time, warmup time and
// freeze time are panel-managed and applied by panel_runtime.cfg, which the
// launcher execs after this profile.
