// CS2 Manager — MatchZy mode base profile.
// Shared infrastructure lives in server.cfg. Match rules remain fully owned by
// the upstream MatchZy cfg files and are not generated by the panel.
echo "[CS2 Manager] Loading MatchZy profile"

exec server.cfg

// GOTV is a MatchZy-only feature (match demos/spectating). Other modes leave it off.
tv_enable 1
