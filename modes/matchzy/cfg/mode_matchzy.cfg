// CS2 Manager — MatchZy mode base profile.
// Every shared convar lives in the shared base profile; this file adds only what
// MatchZy itself needs on top of it.
echo "[CS2 Manager] Loading MatchZy profile"

exec server.cfg

// GOTV is a MatchZy-only feature (match demos/spectating). Other modes leave it off.
tv_enable 1
