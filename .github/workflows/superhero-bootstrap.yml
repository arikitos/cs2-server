name: Bootstrap SuperHero release

on:
  push:
    branches: [superhero]

permissions:
  contents: write

jobs:
  build-superhero:
    if: ${{ !contains(github.event.head_commit.message, '[superhero-release]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: superhero
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build mode release
        shell: pwsh
        run: ./manager/modes/superhero/Release.ps1 -Version 0.1.0
      - name: Run manager tests
        shell: pwsh
        run: python -m unittest discover -s manager/tests -v
      - name: Commit runtime output
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manager/modes/superhero/release/plugins/SuperHeroMod
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "build: stage SuperHero runtime [superhero-release]"
          git push origin superhero
