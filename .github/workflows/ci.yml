name: Build and validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell installer syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          foreach ($path in @('setup.ps1', 'server/scripts/setup.ps1', 'server/scripts/prepare-panel-certificates.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count) { $errors | Format-List; exit 1 }
          }
      - name: Verify automatic Windows HTTPS trust preparation
        shell: powershell
        run: |
          . ./server/scripts/prepare-panel-certificates.ps1
          $count = Prepare-PanelCertificates -ProjectRoot $PWD
          if ($count -lt 1) { throw 'No verified CA certificates were prepared' }
          $files = @(Get-ChildItem panel/certificates/windows-pypi-*.crt)
          if ($files.Count -ne $count) { throw 'CA output count does not match' }
          foreach ($file in $files) {
            $text = Get-Content -Raw $file.FullName
            if ($text -notmatch 'BEGIN CERTIFICATE' -or $text -match 'PRIVATE KEY') { throw 'Invalid public certificate output' }
          }
          # The exporter must reject every TLS validation failure, even with a chain.
          $chain = New-Object System.Security.Cryptography.X509Certificates.X509Chain
          foreach ($errorFlag in @(1, 2, 4)) {
            $rejected = $false
            try {
              [Cs2Panel.WindowsTrust]::CertificateAuthorities($chain, [Net.Security.SslPolicyErrors]$errorFlag) | Out-Null
            } catch { $rejected = $true }
            if (-not $rejected) { throw 'Untrusted TLS chain was accepted' }
          }
          $chain.Dispose()
          # Refresh generated trust while preserving operator-supplied certificates.
          Set-Content panel/certificates/operator.crt 'operator-owned marker'
          Prepare-PanelCertificates -ProjectRoot $PWD | Out-Null
          if ((Get-Content panel/certificates/operator.crt) -ne 'operator-owned marker') { throw 'Operator certificate was replaced' }
      - name: Verify root Windows setup without game downloads
        shell: powershell
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'CS2 root setup validation'
          New-Item -ItemType Directory -Force "$fixture/server/scripts", "$fixture/panel/certificates" | Out-Null
          Copy-Item setup.ps1, .env.example $fixture
          Copy-Item server/scripts/setup.ps1, server/scripts/prepare-panel-certificates.ps1 "$fixture/server/scripts"
          $global:SetupDockerCalls = New-Object 'System.Collections.Generic.List[string]'
          $global:SetupBrowserCalls = 0
          function global:docker {
            $global:LASTEXITCODE = 0
            $command = $args -join ' '
            $global:SetupDockerCalls.Add($command)
            switch ($command) {
              'info' { return }
              'info --format {{.OSType}}' { return 'linux' }
              'info --format {{.Architecture}}' { return 'amd64' }
              'compose version' { return }
              'compose config --quiet' { return }
              'compose --profile game --profile maintenance config --format json' { return '{"services":{}}' }
              'compose up -d --build --no-deps panel' { return }
              default { throw "Unexpected Docker operation: $command" }
            }
          }
          function global:Invoke-WebRequest { return [PSCustomObject]@{ StatusCode = 200 } }
          function global:Start-Process { $global:SetupBrowserCalls++ }
          & "$fixture/setup.ps1"
          $original = Get-Content -Raw "$fixture/.env"
          if ($original -match '(?m)^PANEL_PASSWORD=\r?$') { throw 'Panel password was not generated' }
          if (-not (Test-Path "$fixture/server/state/runtime/compose-runtime.json")) { throw 'Installation configuration missing' }
          & "$fixture/setup.ps1"
          if ((Get-Content -Raw "$fixture/.env") -ne $original) { throw 'Setup changed existing credentials' }
          $panelStarts = @($global:SetupDockerCalls | Where-Object { $_ -eq 'compose up -d --build --no-deps panel' })
          if ($panelStarts.Count -ne 2 -or $global:SetupBrowserCalls -ne 2) { throw 'Panel bootstrap did not complete twice' }
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Docker Compose
        env:
          PANEL_PASSWORD: validation-only-panel-password
          CS2_RCON_PASSWORD: validation-only-rcon-password
        run: docker compose --profile game --profile maintenance config --quiet
      - name: Validate source syntax
        run: |
          python -m py_compile panel/*.py server/runtime/mode_manager.py
          node --check panel/static/app.js
          bash -n server/runtime/runtime-launcher.sh server/frameworks/install-linux.sh server/updater/updater.sh server/scripts/*.sh
      - name: Validate both mode payloads
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'panel')
          import mode_defs
          definitions, errors = mode_defs.load_definitions(Path('modes'))
          if errors or set(definitions) != {'faceit', 'retakes'}:
              raise SystemExit(errors or 'Expected FaceIt and Retakes')
          for mode, definition in definitions.items():
              root = Path('modes') / mode
              for plugin in definition['plugins']:
                  if not (root / plugin['path']).is_dir():
                      raise SystemExit(f"Missing plugin: {mode}/{plugin['path']}")
          PY
      - name: Build panel image
        run: docker build --tag cs2-manager-panel:validation panel
      - name: Verify optional corporate CA support
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=CS2 CI certificate validation' \
            -keyout "$RUNNER_TEMP/panel-ca.key" -out panel/certificates/ci-validation.crt
          docker build --tag cs2-manager-panel:validation-ca panel
          docker run --rm --network none cs2-manager-panel:validation-ca \
            openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt \
            /usr/local/share/ca-certificates/cs2-panel-ci-validation.crt
          docker run --rm --network none cs2-manager-panel:validation-ca \
            python -c 'import ssl; context = ssl.create_default_context(); assert context.verify_mode == ssl.CERT_REQUIRED; assert context.check_hostname'
          printf 'invalid certificate\n' > panel/certificates/ci-validation.crt
          if docker build --tag cs2-manager-panel:invalid-ca panel >"$RUNNER_TEMP/invalid-ca.log" 2>&1; then
            echo 'Invalid CA certificate was accepted'; exit 1
          fi
          rm panel/certificates/ci-validation.crt
      - name: Verify panel image startup
        run: |
          docker run --rm --network none \
            -e PANEL_DATA_DIR=/tmp/state -e PANEL_MODES_DIR=/modes \
            -e PANEL_PASSWORD=validation-only-password \
            -v "$PWD/modes:/modes:ro" \
            cs2-manager-panel:validation \
            python -c 'from wsgi import app; from pathlib import Path; assert app.test_client().get("/healthz").status_code == 200; assert Path("/tmp/state/runtime").stat().st_uid == 1000'
      - name: Verify panel-only bootstrap without game images
        run: |
          bash server/scripts/setup.sh
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null
          if docker image inspect cs2-manager-runtime:pinned >/dev/null 2>&1; then
            echo 'Panel setup unexpectedly built a game image'; exit 1
          fi
          if docker inspect cs2-game >/dev/null 2>&1; then
            echo 'Panel setup unexpectedly created the game container'; exit 1
          fi
          docker exec -i cs2-panel python - <<'PY'
          from wsgi import app
          import app as panel
          import time
          from unittest.mock import patch
          from installation import _configuration, _mount_sources, _container_options
          config = _configuration(panel)
          sources = _mount_sources(panel, config)
          options = _container_options(panel, config, 'cs2-game', sources)
          assert options['host_config']['Init'] is True
          assert options['stop_timeout'] == 40
          assert options['host_config']['PortBindings']['27015/udp']
          assert not panel.client.images.list(name='cs2-manager-updater:pinned')
          with app.test_client() as client:
              auth = (panel.USERNAME, panel.PASSWORD)
              headers = {'X-CS2-Panel': '1'}
              response = client.get('/api/v3/status', auth=(panel.USERNAME, panel.PASSWORD))
              assert response.status_code == 200
              assert response.json['installation']['ready'] is False
              assert response.json['containers'][0]['status'] == 'not-created'
              assert client.post('/api/v3/maintenance/install', json={}, auth=auth, headers=headers).status_code == 403
              # A blocked image download must fail only the job, never the panel.
              with patch('installation._ensure_image', side_effect=RuntimeError('Simulated blocked image download')):
                  response = client.post('/api/v3/maintenance/install', json={'confirm': 'UPDATE CS2'}, auth=auth, headers=headers)
                  assert response.status_code == 202
                  job_id = response.json['job']['id']
                  for _ in range(100):
                      job = client.get('/api/v3/maintenance/jobs/' + job_id, auth=auth).json['job']
                      if job['end']:
                          break
                      time.sleep(0.1)
                  assert job['status'] == 'Failed', job
                  assert 'Simulated blocked image download' in job['error']
              assert client.get('/healthz').status_code == 200
              assert client.get('/api/v3/status', auth=auth).status_code == 200
          PY
          docker compose stop panel
      - name: Build game runtime and updater images
        env:
          PANEL_PASSWORD: validation-only-panel-password
          CS2_RCON_PASSWORD: validation-only-rcon-password
        run: docker compose --profile maintenance build cs2-game cs2-updater
      - name: Verify deferred container creation without Steam downloads
        run: |
          docker start cs2-panel
          docker exec -i cs2-panel python - <<'PY'
          import app as panel
          from installation import _configuration, _mount_sources, _container_options, _run_service
          config = _configuration(panel)
          sources = _mount_sources(panel, config)
          runtime = panel.client.images.get(config['services']['cs2-game']['image'])
          _run_service(panel, panel.Job('ci-init', 'ci'), config, 'cs2-init', runtime, sources)
          options = _container_options(panel, config, 'cs2-game', sources)
          created = panel.client.api.create_container(runtime.id, name=panel.GAME_CONTAINER, **options)
          container = panel.client.containers.get(created['Id'])
          try:
              assert container.status == 'created'
              assert container.attrs['Config']['StopTimeout'] == 40
              assert container.attrs['HostConfig']['Init'] is True
              assert container.attrs['HostConfig']['PortBindings']['27015/udp']
              targets = {mount['Destination'] for mount in container.attrs['Mounts']}
              assert {'/home/steam/cs2-dedicated', '/modes', '/state', '/server-config', '/frameworks'} <= targets
          finally:
              container.remove()
          PY
          docker compose stop panel
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify panel in desktop and mobile Chromium
        env:
          PANEL_PASSWORD: validation-only-panel-password
        run: |
          docker run -d --name panel-preview -p 127.0.0.1:8080:8080 \
            -e PANEL_PASSWORD="$PANEL_PASSWORD" -e PANEL_DATA_DIR=/tmp/state \
            -e GAME_CONTAINER=cs2-validation-stopped \
            -e CS2_PUBLIC_ADDRESS=198.51.100.42 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/modes:/modes:ro" -v "$PWD:/project:ro" \
            cs2-manager-panel:validation
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund \
            playwright-core@1.62.1 @sparticuz/chromium@153.0.0
          mkdir -p "$RUNNER_TEMP/panel-preview"
          cat > "$RUNNER_TEMP/browser/preview.mjs" <<'JS'
          import { chromium as playwright } from 'playwright-core';
          import Chromium from '@sparticuz/chromium';
          const browser = await playwright.launch({
            executablePath: await Chromium.executablePath(),
            args: Chromium.args.filter(arg => !arg.startsWith('--disable-web-security')),
            headless: true,
          });
          const context = await browser.newContext({
            viewport: { width: 1512, height: 1100 },
            httpCredentials: { username: 'admin', password: process.env.PANEL_PASSWORD },
          });
          const page = await context.newPage();
          await context.grantPermissions(['clipboard-read', 'clipboard-write']);
          const errors = [];
          page.on('pageerror', error => errors.push(error.message));
          await page.goto('http://127.0.0.1:8080', { waitUntil: 'networkidle' });
          await page.waitForFunction(() => document.querySelector('#stateBadge').textContent === 'Stopped');
          await page.evaluate(() => { window.ciClipboard = navigator.clipboard; });
          const copied = async action => {
            await page.evaluate(() => { document.querySelector('#message').textContent = ''; });
            await page.locator('[data-action="' + action + '"]').click();
            await page.waitForFunction(() => document.querySelector('#message').textContent.includes('Copied to clipboard'));
            return page.evaluate(() => window.ciClipboard.readText());
          };
          if (await copied('copy-endpoint') !== 'connect 198.51.100.42:27015') {
            throw new Error('Public connection command is incorrect');
          }
          await page.evaluate(async () => {
            const response = await fetch('/api/v3/server/password-policy', {
              method: 'PUT', headers: {'Content-Type': 'application/json', 'X-CS2-Panel': '1'},
              body: JSON.stringify({action: 'set', password: 'CI join password'}),
            });
            if (!response.ok) throw new Error('Could not set join password');
          });
          if (await copied('copy-connect') !== 'connect 198.51.100.42:27015; password "CI join password"') {
            throw new Error('Private connection command is incorrect');
          }
          if ((await page.locator('body').innerText()).includes('CI join password')) {
            throw new Error('Join password leaked into visible UI');
          }
          const ordinaryStatus = await page.evaluate(async () => (await fetch('/api/v3/status')).text());
          if (ordinaryStatus.includes('CI join password')) throw new Error('Join password leaked into status polling');
          // Exercise the textarea fallback used when the Clipboard API is unavailable.
          await page.evaluate(() => Object.defineProperty(navigator, 'clipboard', {value: undefined, configurable: true}));
          if (await copied('copy-endpoint') !== 'connect 198.51.100.42:27015; password "CI join password"') {
            throw new Error('Fallback clipboard command is incorrect');
          }
          if (await page.locator('.clipboard-buffer').count()) throw new Error('Temporary clipboard buffer was retained');
          await page.evaluate(() => { delete navigator.clipboard; });
          await page.evaluate(async () => {
            const response = await fetch('/api/v3/server/password/disable', {
              method: 'POST', headers: {'Content-Type': 'application/json', 'X-CS2-Panel': '1'}, body: '{}',
            });
            if (!response.ok) throw new Error('Could not disable join password');
          });
          if (await copied('copy-connect') !== 'connect 198.51.100.42:27015') {
            throw new Error('Disabled password was included in the connection command');
          }
          for (const screen of ['dashboard', 'modes', 'console', 'players', 'settings', 'maintenance', 'activity']) {
            await page.goto('http://127.0.0.1:8080/#' + screen);
            await page.waitForSelector('#page-' + screen + ':visible');
            await page.waitForTimeout(300);
            if (await page.evaluate(() => document.documentElement.scrollWidth > innerWidth)) {
              throw new Error('Horizontal overflow: ' + screen);
            }
          }
          await page.goto('http://127.0.0.1:8080/#modes');
          await page.locator('[data-action="select-mode"][data-mode="retakes"]').click();
          await page.locator('[data-format="5v4"]').click();
          await page.locator('#hostnameInput').fill('CI Retakes');
          await page.locator('#saveModeButton').click();
          await page.waitForFunction(() => document.querySelector('#message').textContent.includes('Settings saved'));
          const saved = await page.evaluate(async () => (await fetch('/api/v3/modes/retakes')).json());
          if (saved.settings.hostname !== 'CI Retakes' || saved.settings.format !== '5v4') {
            throw new Error('Mode settings were not persisted');
          }
          await page.goto('http://127.0.0.1:8080/#dashboard');
          await page.screenshot({ path: process.env.RUNNER_TEMP + '/panel-preview/desktop.png', fullPage: true });
          await page.setViewportSize({ width: 390, height: 844 });
          await page.waitForTimeout(300);
          const sidebar = await page.locator('.sidebar').boundingBox();
          if (sidebar.x + sidebar.width > 1) throw new Error('Closed mobile navigation is visible');
          await page.screenshot({ path: process.env.RUNNER_TEMP + '/panel-preview/mobile.png', fullPage: true });
          if (await page.evaluate(() => document.documentElement.scrollWidth > innerWidth)) {
            throw new Error('Horizontal overflow on mobile');
          }
          await page.locator('[data-action="menu"]').click();
          await page.locator('.nav-link[href="#players"]').click();
          await page.waitForSelector('#page-players:visible');
          if (errors.length) throw new Error(errors.join('\n'));
          await browser.close();
          JS
          node "$RUNNER_TEMP/browser/preview.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-preview
          path: ${{ runner.temp }}/panel-preview
          if-no-files-found: ignore
