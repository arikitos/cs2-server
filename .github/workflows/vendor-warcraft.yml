name: Vendor Warcraft Classic

on:
  push:
    branches:
      - main
    paths:
      - manager/modes/warcraft/vendor.json
      - .github/workflows/vendor-warcraft.yml
      - .github/scripts/vendor-warcraft.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-warcraft-classic
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CS2 server
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve pinned Warcraft source
        id: source
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          marker = json.loads(Path("manager/modes/warcraft/vendor.json").read_text(encoding="utf-8"))
          repository = marker.get("repository")
          ref = marker.get("ref")
          version = marker.get("version")
          if repository != "arikitos/cs2-warcraft3":
              raise SystemExit("vendor repository must remain arikitos/cs2-warcraft3")
          if not isinstance(ref, str) or not re.fullmatch(r"[0-9a-f]{40}", ref):
              raise SystemExit("vendor ref must be a full lowercase commit SHA")
          if not isinstance(version, str) or not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("vendor version must be semantic X.Y.Z")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"repository={repository}\n")
              output.write(f"ref={ref}\n")
              output.write(f"version={version}\n")
          PY

      - name: Checkout pinned Warcraft source
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.ref }}
          path: _vendor/warcraft-source
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore WarcraftClassic
        run: dotnet restore _vendor/warcraft-source/src/WarcraftClassic/WarcraftClassic.csproj

      - name: Build WarcraftClassic release
        run: >-
          dotnet publish _vendor/warcraft-source/src/WarcraftClassic/WarcraftClassic.csproj
          -c Release
          -o "${{ runner.temp }}/warcraft-publish"
          -p:Version=${{ steps.source.outputs.version }}
          --no-restore

      - name: Vendor runtime into server mode
        run: >-
          python .github/scripts/vendor-warcraft.py
          .
          _vendor/warcraft-source
          "${{ runner.temp }}/warcraft-publish"
          "${{ steps.source.outputs.ref }}"
          "${{ steps.source.outputs.version }}"

      - name: Validate mode definitions
        shell: bash
        run: |
          python -m unittest discover -s manager/tests -p 'test_mode_defs.py' -v
          PYTHONPATH=manager/panel python - <<'PY'
          from pathlib import Path
          from mode_defs import load_definitions

          definitions, errors = load_definitions(Path("manager/modes"))
          if errors:
              raise SystemExit("\n".join(errors))
          if "warcraft" not in definitions:
              raise SystemExit("Warcraft mode was not discovered")
          mode = definitions["warcraft"]
          if mode["requires"]["counterstrikesharp"] != "1.0.371":
              raise SystemExit("Warcraft CounterStrikeSharp requirement drifted")
          if "WarcraftClassic" not in mode["required_plugins"]:
              raise SystemExit("WarcraftClassic is not a required plugin")
          print(f"Validated modes: {', '.join(definitions)}")
          PY
          git diff --check

      - name: Commit vendored Warcraft mode
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md manager/data/server.json manager/modes/warcraft
          if git diff --cached --quiet; then
            echo "Vendored runtime is already current."
            exit 0
          fi
          git commit -m "feat(warcraft): vendor Warcraft Classic ${{ steps.source.outputs.version }}"
          git push origin HEAD:main
